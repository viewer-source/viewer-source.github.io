# The viewer source: the atlas viewer every map site starts from, with a demo of its maps.
name: Viewer source
description: "One viewer, maps from yEd and CellDesigner"
footer-links:
  github: viewer-source
google_analytics:
url: https://viewer-source.github.io
baseurl: ""

collections:
  # one file per map in _maps/, written by build.py, published as /data/<name>/ (JSON), read by the atlas page
  maps:
    output: true
    permalink: /data/:name/

defaults:
  # kept out of search engines while it is being built (noindex in _includes/meta.html)
  - scope:
      path: ""
    values:
      noindex: true
  - scope:
      type: maps
    values:
      layout: map-data

permalink: /:title/
kramdown:
  input: GFM
sass:
  style: :expanded
exclude:
  - README.md
  - CLAUDE.md
  - VERSION
  - build.py
  - maps
  # renderers/ is published for its JavaScript, which the editor runs in the browser; the Python twins, the converter
  # modules and the layout script serve the build and the tests only
  - renderers/yrender/yrender.py
  - renderers/converter/cdrender.py
  - renderers/converter/cd_edit.py
  - renderers/converter/mapconv
  - renderers/converter/get_mapconv.sh
  - renderers/layout/tidy.py
  - renderers/layout/complex_pack.py
  - renderers/layout/snap_grid.py
  - renderers/layout/get_layout.sh
  - renderers/render.js
  - databases.py
  - cache
  - tests
  - package.json
  - package-lock.json
  - node_modules
