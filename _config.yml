# The viewer source: the atlas viewer every map site starts from, with a demo of its maps.
name: Viewer source
description: "One viewer, maps from yEd and CellDesigner"
footer-links:
  github: viewer-source
google_analytics:
url: https://viewer-source.github.io
baseurl: ""

collections:
  # one file per map in _maps/, written by build.py, published as /data/<name>/ (JSON), read by the atlas page
  maps:
    output: true
    permalink: /data/:name/

defaults:
  # kept out of search engines while it is being built (noindex in _includes/meta.html)
  - scope:
      path: ""
    values:
      noindex: true
  - scope:
      type: maps
    values:
      layout: map-data

permalink: /:title/
kramdown:
  input: GFM
sass:
  style: :expanded
exclude:
  - README.md
  - VERSION
  - build.py
  - maps
  - reference
  # renderers/ is published for its JavaScript, which the editor runs in the browser; the converter's modules serve the
  # build only, the rules pages are for reading the code
  - renderers/converter/mapconv
  - renderers/converter/get_mapconv.sh
  - renderers/yrender/rules.md
  - renderers/converter/cdrender-rules.md
  - renderers/converter/cd_edit-rules.md
  - renderers/layout/complex_pack-rules.md
  - renderers/layout/snap_grid-rules.md
  - renderers/layout/tidy-rules.md
  - renderers/render.js
  - databases.py
  - cache
  - tests
  - package.json
  - package-lock.json
  - node_modules
# the top bar's links (_includes/site-header.html)
nav:
  - name: Atlas
    url: /
  - name: Architecture
    url: /architecture/
  - name: Guide
    url: /guide/
