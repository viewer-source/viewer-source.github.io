# The Python masters and their JavaScript twins in the editor must give the same, byte for byte: yrender.py and
# yrender.js on every demo map in the renderer's three ways (tests/yrender-compare.js); tidy.py with the layout skill's
# complex_pack.py and snap_grid.py and layout.js in every case of tests/layout-compare.js; cdrender.py and cd_edit.py
# and their .js twins on every demo CellDesigner map (tests/cd-compare.js). Runs when any changes, or by hand.
name: Compare renderers
on:
  push:
    branches: [main]
    paths: ['renderers/**', 'tests/**', 'maps/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install lxml && npm ci
      - run: node tests/yrender-compare.js python3
      - run: node tests/layout-compare.js python3
      - run: node tests/cd-compare.js python3
      - run: node tests/cd-live.js
      - run: node tests/cd-snap-redo.js
      - run: node tests/cd-modifier-spot.js
      - run: node tests/cd-square.js
      - run: node tests/sbgn-edit.js python3
      - run: node tests/sbgn-reconnect.js python3
