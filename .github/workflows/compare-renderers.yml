# Every test that runs without a browser (tests/run-all.sh, the one list): the JavaScript renderers and their Python
# twins the same byte for byte on every demo map, layout.js against the layout skill's scripts, the editor's writes
# into CellDesigner, SBGN-ML and SBML read back by the converter. Runs when any changes, or by hand.
name: Compare renderers
on:
  push:
    branches: [main]
    paths: ['renderers/**', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4   # the demo and test maps, from the site's data repository (as the build)
        with:
          repository: ${{ github.repository_owner }}/${{ github.repository_owner }}-data
          token: ${{ secrets.DATA_TOKEN }}
          path: .data
      - run: for d in maps test-maps cache parked; do [ -d .data/$d ] && cp -r .data/$d .; done; rm -rf .data
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install lxml && npm ci
      - run: python3 build.py   # downloads/: the SBGN-ML written from the GraphML maps, which some tests read
      - run: sh tests/run-all.sh   # every test without a browser, the list kept there
