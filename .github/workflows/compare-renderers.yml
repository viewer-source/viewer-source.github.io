# yrender.py (the master) and yrender.js (the editor's redraw) must draw every map alike, byte for byte, in the three
# ways the renderer is used (tests/yrender-compare.js). Runs when either changes, or by hand.
name: Compare renderers
on:
  push:
    branches: [main]
    paths: ['renderers/yrender/**', 'tests/**', 'maps/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install lxml && npm install --no-save @xmldom/xmldom
      - run: node tests/yrender-compare.js python3
