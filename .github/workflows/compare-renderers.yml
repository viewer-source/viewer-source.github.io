# Every test that runs without a browser (tests/run-all.sh, the one list): the JavaScript renderers, layout.js and
# cd_edit's writes against the reference set kept in the site's data repository (reference/, tests/reference.js), the
# editor's writes into CellDesigner, SBGN-ML and SBML read back by the converter. Runs by hand only, at the end of a build round, in four parts at once on four machines, every part to its end even when another fails.
name: Compare renderers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    name: compare ${{ matrix.part }}
    concurrency:
      group: compare-${{ matrix.part }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4   # the demo and test maps, from the site's data repository (as the build)
        with:
          repository: ${{ github.repository_owner }}/${{ github.repository_owner }}-data
          token: ${{ secrets.DATA_TOKEN }}
          path: .data
      - run: for d in maps test-maps cache parked reference; do [ -d .data/$d ] && cp -r .data/$d .; done; rm -rf .data
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install lxml && npm ci
      - run: python3 build.py   # downloads/: the SBGN-ML written from the GraphML maps, which some tests read
      - run: sh tests/run-all.sh ${{ matrix.part }}   # one part of every test without a browser, the list kept there
