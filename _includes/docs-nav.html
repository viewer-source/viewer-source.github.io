<!-- the row linking the viewer's pages: the page shown dark grey and not linked, the others grey -->
<style>
  .dn-row { display: flex; gap: 18px; font-size: 14px; margin: 0 0 14px; }
  #main .dn-row a { color: #777; text-decoration: none; }
  #main .dn-row a:hover { color: #333; }
  .dn-row span { color: #333; }
</style>
<div class="dn-row" role="navigation" aria-label="The viewer's pages">
  {% assign here = include.here %}
  {% if here == "atlas" %}<span>Atlas</span>{% else %}<a href="/">Atlas</a>{% endif %}
  {% if here == "architecture" %}<span>Architecture</span>{% else %}<a href="/architecture/">Architecture</a>{% endif %}
  {% if here == "guide" %}<span>Guide</span>{% else %}<a href="/guide/">Guide</a>{% endif %}
</div>
