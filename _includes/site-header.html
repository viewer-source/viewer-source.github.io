{% comment %}
The top bar, on every atlas: the site's name at the left, the site's
pages at the right (`nav` in _config.yml), the page shown in darker grey. The viewer's separator above the map hides it.
{% endcomment %}
<div class="wrapper-masthead">
  <div class="container">
    <header class="masthead clearfix">
      <div class="site-info">
        <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
      </div>
      <nav>{% for l in site.nav %}<a href="{{ site.baseurl }}{{ l.url }}"{% if page.url == l.url %} class="active"{% endif %}>{{ l.name }}</a>{% endfor %}</nav>
    </header>
  </div>
</div>
